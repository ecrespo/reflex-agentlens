# Release (plan task P7-05.1; REQ-206, Tech Design §9.1, Constitution Art. 10).
#
# A `v*` tag on a commit of `main` publishes:
#   - the wheel and the sdist to PyPI with trusted publishing (`uv publish`, environment `pypi`);
#   - ghcr.io/ecrespo/reflex-agentlens for linux/amd64 and linux/arm64, tagged X.Y.Z, X.Y and
#     latest (a pre-release such as 0.1.0a1 is tagged 0.1.0-alpha.1 only);
#   - a GitHub release whose notes come from scripts/changelog.py.
# Before tagging, the release PR bumps `__version__` and runs
# `uv run python scripts/changelog.py X.Y.Z --write CHANGELOG.md`; the tag must match the version.
#
# Run by hand (workflow_dispatch) or on a pull request that touches the release files, it is a
# dry run: everything is built and tested, nothing is published. The PyPI trusted publisher and the GHCR package are set up by the maintainer.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request: # dry run when the release machinery changes
    paths:
      - .github/workflows/release.yml
      - scripts/release_plan.py
      - scripts/changelog.py
      - Dockerfile
      - hatch_build.py

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: version and tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      image_tags: ${{ steps.plan.outputs.image_tags }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(uv run --no-project python scripts/release_plan.py version)"
          if [ "$EVENT" = "push" ]; then
            [ "$REF_NAME" = "v$version" ] || { echo "tag $REF_NAME != v$version"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "tag $REF_NAME is not on main"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "version=$version"
            echo "prerelease=$(uv run --no-project python scripts/release_plan.py prerelease "$version")"
            echo "image_tags=$(uv run --no-project python scripts/release_plan.py image-tags "$version")"
          } >> "$GITHUB_OUTPUT"

  dist:
    name: wheel and sdist
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: uv sync --frozen
      - run: uv build --wheel --sdist -o dist
      - name: boot the wheel without node or bun
        run: |
          AGENTLENS_WHEEL="$(ls dist/*.whl)" uv run pytest -p no:randomly -v -s tests/packaging
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    needs: [plan, dist]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-agentlens/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv publish --trusted-publishing always dist/*

  image:
    name: container image (amd64, arm64)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ecrespo/reflex-agentlens
      TAGS: ${{ needs.plan.outputs.image_tags }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - run: docker buildx create --use --name release
      - name: log in to GHCR
        if: env.PUBLISH == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: build (and push on a tag)
        run: |
          args=()
          for tag in $TAGS; do args+=(--tag "$IMAGE:$tag"); done
          if [ "$PUBLISH" = "true" ]; then out=--push; else out=--output=type=cacheonly; fi
          docker buildx build --platform linux/amd64,linux/arm64 "${args[@]}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "$out" .

  github-release:
    name: GitHub release
    needs: [plan, pypi, image]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' "$REF_NAME^" 2>/dev/null || true)"
          since=()
          if [ -n "$previous" ]; then since=(--since "$previous"); fi
          uv run --no-project python scripts/changelog.py "$VERSION" "${since[@]}" > notes.md
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$REF_NAME" --title "reflex-agentlens $VERSION" \
            --notes-file notes.md --verify-tag "${flags[@]}"
