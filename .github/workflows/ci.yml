# CI: lint, types, tests (plan task P1-03.1; REQ-360.a, REQ-361.a, REQ-362.a).
# Every action is pinned by commit SHA (Constitution Art. 4); the tag is in the trailing comment.
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check --output-format=github
      - name: ruff format
        run: uv run ruff format --check
      - name: import contracts
        run: uv run lint-imports
      - name: lockfile is current
        run: uv lock --check
      - name: REQ traceability (report only until P10-02)
        run: uv run python scripts/check_req_coverage.py --report-only

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy

  test:
    name: test (py${{ matrix.python }}, sqlite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Alembic upgrade head from an empty SQLite database
        run: uv run python scripts/check_upgrade_head.py sqlite
      - name: pytest with coverage gate (ingest + store + query >= 85 %)
        run: uv run pytest --cov --cov-report=term

  test-pg:
    name: test (py3.13, postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentlens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      HYPOTHESIS_PROFILE: ci
      AGENTLENS_TEST_PG_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentlens_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Alembic upgrade head from an empty PostgreSQL schema
        run: uv run python scripts/check_upgrade_head.py pg --url "$AGENTLENS_TEST_PG_URL"
      - name: pytest (PostgreSQL-backed tests)
        run: uv run pytest -m pg

  smoke:
    # P6-11.2 / P6-12.1 (DD-002, REQ-363): export the frontend with Bun, boot `serve` on it, then
    # drive the standalone app and a host app that mounts agentlens in Chromium.
    name: smoke (built frontend, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: uv sync --frozen
      - name: export the frontend
        run: uv run python -m reflex_agentlens._webapp.build
      - name: install Chromium
        run: uv run playwright install --with-deps chromium
      - name: serve with the built frontend, then the browser smoke suite
        env:
          AGENTLENS_REQUIRE_FRONTEND: "1"
          AGENTLENS_SMOKE: "1"
        run: >-
          uv run pytest -p no:randomly -v
          tests/integration/cli/test_standalone_serve.py tests/smoke

  wheel:
    # P7-01 (DD-002, REQ-200.b, 210.b): build the wheel (the hook exports the frontend with Bun)
    # and the sdist, then boot the wheel in a fresh venv whose PATH holds no node or bun.
    name: wheel (build + boot without a JS runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: uv sync --frozen
      - name: build the wheel and the sdist
        run: uv build --wheel --sdist -o dist
      - name: boot the wheel without node or bun
        run: |
          AGENTLENS_WHEEL="$(ls dist/*.whl)" uv run pytest -p no:randomly -v -s tests/packaging

  docker:
    # P7-02.2 / P7-03.1 (REQ-203, 204, 326, 364, DD-021): build the image, lint the Dockerfile,
    # scan the image, then run it hardened (read-only root, no capabilities) and through compose.
    name: docker (image, scan, compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTLENS_IMAGE: reflex-agentlens:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1-alpine hadolint - < Dockerfile
      - name: build the image
        run: docker build -t "$AGENTLENS_IMAGE" .
      - name: trivy (fails on unwaived CRITICAL findings; HIGH reported)
        run: |
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:0.75.0 image --quiet \
              --scanners vuln --ignorefile /.trivyignore "$@" "$AGENTLENS_IMAGE"
          }
          scan --severity HIGH,CRITICAL --format table
          scan --severity CRITICAL --exit-code 1
      - run: uv sync --frozen
      - name: image and compose tests
        run: uv run pytest -p no:randomly -v -s tests/docker
