[project]
name = "reflex-agentlens"
dynamic = ["version"]
description = "Self-hosted observability for AI agents, built with Reflex: OpenTelemetry GenAI traces, run timelines, graph replay, token and cost analytics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ernesto Crespo" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "grpcio>=1.68",
    "opentelemetry-proto>=1.29",
    "pydantic>=2",
    "reflex>=0.10.1,<0.11",
    "reflex-mermaidjs>=0.2.1,<0.3",
    "reflex-silverpoint-react>=0.8.1,<0.9",
]

[project.urls]
Repository = "https://github.com/ecrespo/reflex-agentlens"

[project.scripts]
reflex-agentlens = "reflex_agentlens.cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/reflex_agentlens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reflex_agentlens"]

[tool.hatch.build.targets.wheel.hooks.custom]
# Spike prototype (P0-02.2): exports the Reflex frontend into reflex_agentlens/_frontend/.
path = "hatch_build.py"
dependencies = ["reflex>=0.10.1,<0.11", "reflex-silverpoint-react>=0.8.1,<0.9", "reflex-mermaidjs>=0.2.1,<0.3", "pydantic>=2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"src/reflex_agentlens/cli/**" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
