[project]
name = "reflex-agentlens"
dynamic = ["version"]
description = "Self-hosted observability for AI agents, built with Reflex: OpenTelemetry GenAI traces, run timelines, graph replay, token and cost analytics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ernesto Crespo" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "reflex>=0.10.1,<0.11",
    "reflex-silverpoint-react>=0.8.1,<0.9",
    "reflex-mermaidjs>=0.2.1,<0.3",
    "opentelemetry-proto>=1.45.2,<2",
    "grpcio>=1.85.1,<2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.20.1,<2",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "regex>=2024",
]

[project.optional-dependencies]
selftelemetry = [
    "opentelemetry-sdk>=1.45.2,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2,<2",
]

[project.urls]
Repository = "https://github.com/ecrespo/reflex-agentlens"

[project.scripts]
reflex-agentlens = "reflex_agentlens.cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/reflex_agentlens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reflex_agentlens"]

[dependency-groups]
dev = [
    "coverage[toml]>=7",
    "hypothesis>=6",
    "import-linter>=2",
    "mypy>=1.13",
    "playwright>=1.48",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
docs = [
    "mkdocs-material>=9.5",
]
bench = [
    "opentelemetry-sdk>=1.45.2,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2,<2",
]

[tool.uv.workspace]
members = ["site", "examples"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Specs are documentation; their code blocks are illustrative, not formatted source.
extend-exclude = ["specs", "changes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"src/reflex_agentlens/cli/**" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
