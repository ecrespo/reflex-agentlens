[project]
name = "agentlens-examples"
version = "0.0.0"
description = "Example agents that emit OpenTelemetry GenAI traces for reflex-agentlens. Not published."
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlens_examples"]
